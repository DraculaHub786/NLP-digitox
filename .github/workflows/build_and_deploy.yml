name: Build and Deploy to Play Store

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - run: flutter --version

      - name: Reconstruct Keystore File
        run: |
          echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > $HOME/keystore.jks
          echo "KEYSTORE_FILE=$HOME/keystore.jks" >> $GITHUB_ENV

      - name: Set up environment for signing
        run: |
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update pubspec.yaml
        run: |
          cd $GITHUB_WORKSPACE
          sed -i "s/^version: .*/version: ${{ env.VERSION }}/" pubspec.yaml

      # `.env` is no longer bundled as an asset, so the keys must be passed at
      # compile time. Reconstruct the file from repository secrets (empty
      # secrets just produce empty values - the same "not configured" state a
      # build without any keys has always had). `.env` is gitignored, so it is
      # not present in the checkout otherwise.
      - name: Reconstruct .env
        run: |
          cat > .env <<EOF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_CLEANUP_WEBHOOK_URL=${{ secrets.CLOUDINARY_CLEANUP_WEBHOOK_URL }}
          SESSION_COMPLETE_WEBHOOK_URL=${{ secrets.SESSION_COMPLETE_WEBHOOK_URL }}
          SESSION_WEBHOOK_SECRET=${{ secrets.SESSION_WEBHOOK_SECRET }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        # --no-tree-shake-icons is a safety net: habit/note icons are now
        # looked up through AppIcons' const map (lib/models/app_icons.dart),
        # which the tree-shaker can already resolve statically, but this
        # flag protects against any *future* dynamically-built IconData
        # elsewhere in the app silently losing its glyph in release builds.
        run: flutter build appbundle --release --no-tree-shake-icons --dart-define-from-file=.env

      - name: Upload AAB to Play Store
        id: upload_google_play
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          inAppUpdatePriority: ${{ secrets.UPDATE_PRIORITY }} # Between 0-5 => Higher the number, higher the priority.
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          changesNotSentForReview: ${{ secrets.DONT_SEND_CHANGES_FOR_REVIEW }}  # true or false
          # mappingFile: build/app/outputs/mapping/release/mapping.txt
          # debugSymbols: build\app\intermediates\merged_native_libs\release\mergeReleaseNativeLibs\out\lib

      - name: Cleanup
        run: |
          echo "Cleaning up temporary files..."
          rm -rf build
          rm $HOME/keystore.jks
          echo "Cleanup complete."
