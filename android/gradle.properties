org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true

# Disable icon tree-shaking because habits/notes store icons as dynamic
# IconData decoded from JSON (non-constant IconData), which the release
# tree-shaker rejects. Trade a few hundred KB of APK size for a buildable
# app — the icons are fully functional either way.
tree-shake-icons=false
